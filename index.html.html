<title>Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--card:#fffdf8;--ink:#2b3526;--muted:#7d8570;--sage:#c6c9ae;--sage2:#9da17f;--line:#cfd1bd;--today:#e9ecd6;--note:#f3e6d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c211a;--card:#242a21;--ink:#e8ead9;--muted:#a1a88f;--sage:#434a38;--sage2:#7f875f;--line:#3d4435;--today:#32392a;--note:#3a3327}}
:root[data-theme="dark"]{--bg:#1c211a;--card:#242a21;--ink:#e8ead9;--muted:#a1a88f;--sage:#434a38;--sage2:#7f875f;--line:#3d4435;--today:#32392a;--note:#3a3327}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px;position:relative}
.leaf{position:absolute;top:0;left:0;width:110px;opacity:.7;pointer-events:none}
.blob{position:absolute;top:0;right:0;width:130px;opacity:.6;pointer-events:none}
header{text-align:center;padding:18px 0 6px;position:relative}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;letter-spacing:.08em;font-size:34px;margin:0;line-height:1}
.script{font-family:"Great Vibes","Snell Roundhand",cursive;font-size:34px;color:var(--sage2);margin-top:-4px}
.meta{margin:6px 0 2px;font-size:15px;color:var(--muted)}
.meta b{color:var(--ink);font-family:"Playfair Display",Georgia,serif;font-size:19px}
.nav{display:flex;gap:8px;align-items:center;margin:12px 0 16px;position:relative}
.nav button,.nav select{font:inherit;font-size:15px;color:var(--ink);background:var(--sage);border:1px solid var(--line);border-radius:12px;height:44px;padding:0 14px}
.nav button{min-width:48px}
.nav select{flex:1;min-width:0}
.nav button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:1fr;gap:26px 14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.day{position:relative;border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:30px 10px 10px}
.day.today{background:var(--today);border-color:var(--sage2)}
.day.out{opacity:.5}
.tag{position:absolute;top:-14px;left:12px;right:60px;background:var(--sage);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.tag span{font-weight:500;letter-spacing:0;text-transform:none;opacity:.8}
.day .ic{position:absolute;top:8px;right:12px;color:var(--sage2);font-size:15px}
textarea,.todo input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;outline:0;resize:none}
.day textarea{min-height:130px;line-height:1.55;background-image:repeating-linear-gradient(transparent,transparent 24.5px,var(--line) 25px);background-attachment:local}
.todo{position:relative;border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:34px 12px 12px;grid-column:1/-1}
.todo .tag{left:20px;right:auto;background:var(--sage);padding:5px 26px;font-size:15px}
.rows{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line)}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--sage2);border-radius:50%;flex:none;margin:0;background:transparent}
.row input[type=checkbox]:checked{background:var(--sage2);box-shadow:inset 0 0 0 4px var(--card)}
.row input[type=text]{height:40px}
.row.done input[type=text]{text-decoration:line-through;opacity:.55}
.notes{margin-top:14px;background:var(--note);border-radius:6px;padding:12px;text-align:center;font-family:"Great Vibes",cursive;font-size:24px;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12);transform:rotate(-1deg)}
#st{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:12px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 9px}
.tabs{display:flex;gap:6px;background:var(--sage);border-radius:14px;padding:4px;margin:10px 0 0;position:relative}
.tabs button{flex:1;font:inherit;font-size:15px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink)}
.tabs button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mh{display:flex;align-items:center;gap:8px;margin:14px 0 12px;position:relative}
.mh button{font:inherit;font-size:18px;width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sage);color:var(--ink)}
.mh button:disabled{opacity:.35}
.mt{flex:1;text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:22px}
.mg{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px;position:relative}
.mg .hd{text-align:center;font-size:12px;letter-spacing:.05em;color:var(--muted);padding:4px 0;text-transform:uppercase}
.mw{font:inherit;font-size:12px;color:var(--muted);background:var(--sage);border:0;border-radius:8px}
.mc{font:inherit;display:flex;flex-direction:column;align-items:flex-start;min-height:62px;padding:4px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:left;overflow:hidden;min-width:0}
.mc b{font-size:14px}.mc i{font-style:normal;font-size:10px;line-height:1.15;color:var(--muted);margin-top:2px;word-break:break-word}
.mc.o{opacity:.4}.mc.td{background:var(--today);border-color:var(--sage2)}.mc.has b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sage2);margin-left:4px;vertical-align:middle}
.yg{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
@media(min-width:620px){.yg{grid-template-columns:repeat(3,1fr)}}
.ym{border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:8px}
.ym>button{font:inherit;font-weight:700;width:100%;border:0;background:var(--sage);color:var(--ink);border-radius:8px;padding:5px;margin-bottom:6px;font-size:13px}
.yd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd span{text-align:center;font-size:9px;color:var(--muted)}
.yd button{font:inherit;font-size:11px;aspect-ratio:1;border:0;border-radius:6px;background:transparent;color:var(--ink);padding:0}
.yd button.has{background:var(--sage2);color:#fff}.yd button.td{outline:2px solid var(--ink)}
.yd i{display:block}
.bk{display:flex;gap:8px;justify-content:center;margin:0 14px 70px}.bk button{font:inherit;font-size:14px;height:40px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--sage);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
<svg class="leaf" viewBox="0 0 110 130" fill="#9da17f"><g stroke="#7f875f" stroke-width="1.5" fill="none"><path d="M5 10C30 40 50 70 70 125"/></g><ellipse cx="30" cy="30" rx="16" ry="9" transform="rotate(35 30 30)"/><ellipse cx="50" cy="55" rx="16" ry="9" transform="rotate(50 50 55)"/><ellipse cx="62" cy="85" rx="15" ry="8" transform="rotate(65 62 85)"/><ellipse cx="14" cy="55" rx="14" ry="8" transform="rotate(-20 14 55)"/><ellipse cx="35" cy="90" rx="14" ry="8" transform="rotate(-10 35 90)"/></svg>
<svg class="blob" viewBox="0 0 130 100"><path d="M130 0V90C100 90 70 60 60 40C50 20 40 0 40 0Z" fill="#c6c9ae"/><path d="M45 0C60 25 85 50 130 62" stroke="#e5d3b5" stroke-width="3" fill="none"/></svg>
<header>
<h1>WEEKLY</h1>
<div class="script">Planner ♡</div>
<div class="meta"><b id="wk"></b> · <span id="rng"></span></div>
</header>
<div class="tabs"><button data-v="week" class="on">Week</button><button data-v="month">Month</button><button data-v="year">Year</button></div>
<div id="pane"></div>
<div class="nav" id="wnav" style="margin-top:14px">
<button id="prev" aria-label="Previous week">‹</button>
<select id="sel" aria-label="Jump to week"></select>
<button id="today">Today</button>
<button id="next" aria-label="Next week">›</button>
</div>
<div id="grid" class="grid"></div>
</div>
<div class="bk"><button id="bkp">Back up</button><button id="rst">Restore</button><input type="file" id="fi" accept=".json,application/json" hidden></div>
<div id="st"></div>
<script>
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ICS=["","♡","✧","","♡","✧","♡"];
var FIRST=new Date(2026,9,26),LAST=new Date(2027,11,31),RSTART=new Date(2026,10,1);
var weeks=[];for(var d=new Date(FIRST);d<=LAST;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7))weeks.push(d);
function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmt(d){return d.getDate()+" "+MON[d.getMonth()]}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
var cur=0,data={},store=null,timer=null,sel=document.getElementById("sel");
var now=new Date(),todayD=new Date(now.getFullYear(),now.getMonth(),now.getDate());
weeks.forEach(function(w,i){var o=document.createElement("option");o.value=i;o.textContent="Week "+isoWeek(w)+" · "+fmt(w)+" "+w.getFullYear();sel.appendChild(o)});
function empty(){var t=[];for(var i=0;i<8;i++)t.push({c:0,x:""});return{d:["","","","","","",""],t:t}}
function lsGet(k){try{return JSON.parse(localStorage.getItem("wp:"+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("wp:"+k,JSON.stringify(v));return true}catch(e){return false}}
function status(s){document.getElementById("st").textContent=s}
async function load(k){if(!data[k])data[k]=lsGet(k)||empty()}
function save(k){status(lsSet(k,data[k])?"Saved on this phone ✓":"⚠ Not saved – storage blocked")}
async function show(i){
 cur=Math.max(0,Math.min(weeks.length-1,i));
 var w=weeks[cur],k=key(w);await load(k);var D=data[k];
 document.getElementById("wk").textContent="Week "+isoWeek(w);
 document.getElementById("rng").textContent=fmt(w)+" – "+fmt(addDays(w,6))+" "+addDays(w,6).getFullYear();
 sel.value=cur;document.getElementById("prev").disabled=cur==0;document.getElementById("next").disabled=cur==weeks.length-1;
 var h="";
 for(var j=0;j<7;j++){var dd=addDays(w,j),out=dd<RSTART||dd>LAST,td=dd.getTime()==todayD.getTime();
  h+='<div class="day'+(td?" today":"")+(out?" out":"")+'"><div class="tag">'+DAYS[j]+'<span>'+fmt(dd)+'</span></div><div class="ic">'+ICS[j]+'</div><textarea data-d="'+j+'" aria-label="'+DAYS[j]+' notes">'+esc(D.d[j])+'</textarea></div>';}
 h+='<div class="todo"><div class="tag">TO DO LIST ♡</div><div class="rows">';
 for(var r=0;r<8;r++){var it=D.t[r];h+='<div class="row'+(it.c?" done":"")+'"><input type="checkbox" data-c="'+r+'"'+(it.c?" checked":"")+'><input type="text" data-x="'+r+'" value="'+esc(it.x)+'"></div>';}
 h+='</div><div class="notes">Plan your week, make it awesome</div></div>';
 var g=document.getElementById("grid");g.innerHTML=h;
 g.querySelectorAll("textarea").forEach(grow);
 window.scrollTo(0,0);
}
function grow(t){t.style.height="auto";t.style.height=Math.max(130,t.scrollHeight)+"px"}
document.getElementById("grid").addEventListener("input",function(e){
 var k=key(weeks[cur]),D=data[k],t=e.target;
 if(t.dataset.d!=null){D.d[+t.dataset.d]=t.value;grow(t)}
 else if(t.dataset.x!=null)D.t[+t.dataset.x].x=t.value;
 else if(t.dataset.c!=null){D.t[+t.dataset.c].c=t.checked?1:0;t.parentNode.classList.toggle("done",t.checked)}
 save(k);
});
document.getElementById("prev").onclick=function(){show(cur-1)};
document.getElementById("next").onclick=function(){show(cur+1)};
sel.onchange=function(){show(+sel.value)};
document.getElementById("today").onclick=function(){show(todayIdx())};
function todayIdx(){var n=0;for(var i=0;i<weeks.length;i++)if(weeks[i]<=todayD)n=i;return todayD<FIRST?0:n}
var ML=["January","February","March","April","May","June","July","August","September","October","November","December"];
var view="week",cm=Math.max(0,Math.min(13,(todayD.getFullYear()-2026)*12+todayD.getMonth()-10));
function mon(d){return addDays(d,-((d.getDay()+6)%7))}
function wIdx(d){return Math.max(0,Math.min(weeks.length-1,Math.round((mon(d)-FIRST)/6048e5)))}
function txt(d){var m=mon(d),D=data[key(m)]||lsGet(key(m));return D&&D.d[(d.getDay()+6)%7]?D.d[(d.getDay()+6)%7].trim():""}
function sameD(a,b){return a.getTime()==b.getTime()}
function monthHTML(){
 var f=new Date(2026,10+cm,1),m=f.getMonth(),off=(f.getDay()+6)%7,n=new Date(f.getFullYear(),m+1,0).getDate(),rows=Math.ceil((off+n)/7),s=addDays(f,-off);
 var h='<div class="mh"><button id="mp"'+(cm==0?" disabled":"")+'>‹</button><div class="mt">'+ML[m]+" "+f.getFullYear()+'</div><button id="mn"'+(cm==13?" disabled":"")+'>›</button></div><div class="mg"><div class="hd">Wk</div>';
 DAYS.forEach(function(x){h+='<div class="hd">'+x.slice(0,3)+'</div>'});
 for(var r=0;r<rows;r++){var ws=addDays(s,r*7);h+='<button class="mw" data-w="'+wIdx(ws)+'">'+isoWeek(ws)+'</button>';
  for(var j=0;j<7;j++){var d=addDays(ws,j),t=txt(d);h+='<button class="mc'+(d.getMonth()!=m?" o":"")+(t?" has":"")+(sameD(d,todayD)?" td":"")+'" data-w="'+wIdx(d)+'"><b>'+d.getDate()+'</b>'+(t?'<i>'+esc(t.slice(0,16))+'</i>':"")+'</button>'}}
 return h+'</div>';
}
function yearHTML(){
 var h='<div class="mh"><div class="mt">Nov 2026 – Dec 2027</div></div><div class="yg">';
 for(var i=0;i<14;i++){var f=new Date(2026,10+i,1),off=(f.getDay()+6)%7,n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
  h+='<div class="ym"><button data-m="'+i+'">'+MON[f.getMonth()]+" "+f.getFullYear()+'</button><div class="yd">';
  "MTWTFSS".split("").forEach(function(c){h+='<span>'+c+'</span>'});
  for(var b=0;b<off;b++)h+='<span></span>';
  for(var k=1;k<=n;k++){var d=new Date(f.getFullYear(),f.getMonth(),k);h+='<button class="'+(txt(d)?"has ":"")+(sameD(d,todayD)?"td":"")+'" data-w="'+wIdx(d)+'">'+k+'</button>'}
  h+='</div></div>'}
 return h+'</div>';
}
function setView(v){
 view=v;document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.v==v)});
 var w=v=="week";document.getElementById("wnav").style.display=w?"":"none";document.getElementById("grid").style.display=w?"":"none";
 var p=document.getElementById("pane");p.style.display=w?"none":"";
 if(v=="month")p.innerHTML=monthHTML();else if(v=="year")p.innerHTML=yearHTML();
 window.scrollTo(0,0);
}
document.querySelector(".tabs").onclick=function(e){var b=e.target.closest("button");if(b)setView(b.dataset.v)};
document.getElementById("pane").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.id=="mp"){cm--;setView("month")}else if(b.id=="mn"){cm++;setView("month")}
 else if(b.dataset.m!=null){cm=+b.dataset.m;setView("month")}
 else if(b.dataset.w!=null){show(+b.dataset.w);setView("week")}
};
setView("week");
show(todayIdx());
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
document.getElementById("bkp").onclick=async function(){
 var all={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("wp:")==0)all[k.slice(3)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
 var txt=JSON.stringify({app:"weekly-planner",v:1,weeks:all}),name="planner-backup-"+new Date().toISOString().slice(0,10)+".json";
 try{var f=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name=="AbortError")return}
